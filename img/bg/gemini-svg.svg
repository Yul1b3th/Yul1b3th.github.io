<svg width="100%" height="100%" viewBox="0 0 1440 900" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Landing Page Secondary Section Background - Tilted &amp; Rebalanced</title>
    
    <defs>
        <!-- Degradado suave invertido para las formas orgánicas -->
        <linearGradient id="gradientShapeAlternative" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#7FE6C0; stop-opacity:0.12" />
            <stop offset="100%" style="stop-color:#30DAA6; stop-opacity:0.01" />
        </linearGradient>
    </defs>

    <!-- 1. Fondo de la sección -->
    <rect width="1440" height="900" fill="#0B132B" fill-opacity="1"/>

    <!-- 2. Círculo difuminado gigante de fondo (Glow) -->
    <circle cx="1240" cy="450" r="350" fill="#7FE6C0" opacity="0.03" filter="blur(45px)" />

    <!-- 3. Patrón de puntos (Centro-Superior) -->
    <g id="dotPatternCenterTop" transform="translate(680, 100)">
        <circle cx="0" cy="0" r="1.5" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="20" cy="0" r="1.5" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="40" cy="0" r="1.5" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="0" cy="20" r="1.5" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="20" cy="20" r="1.5" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="40" cy="20" r="1.5" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="0" cy="40" r="1.5" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="20" cy="40" r="1.5" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="40" cy="40" r="1.5" fill="#7FE6C0" fill-opacity="0.12" />
    </g>

    <!-- 4. Formas abstractas y geométricas alternativas -->

    <!-- ¡MÁS INCLINADO! Gran forma de cuña/triángulo orgánico en la zona izquierda con una diagonal muy tendida -->
    <path d="M0,900 C300,850 550,700 750,450 L750,900 Z" fill="url(#gradientShapeAlternative)" />

    <!-- Onda Dashed que acompaña fielmente la nueva inclinación pronunciada -->
    <path d="M0,870 C320,820 580,670 780,420" fill="none" stroke="#7FE6C0" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="10 6" />

    <!-- Líneas de cuadrícula/Grid sutiles -->
    <path d="M0,200 L1440,200 M0,700 L1440,700 M360,0 L360,900 M1080,0 L1080,900" stroke="#7FE6C0" stroke-opacity="0.03" stroke-width="1" />


    <!-- 5. ELEMENTOS FLOTANTES REUBICADOS (Ventana principal movida al centro-derecha para llenar el vacío) -->

    <!-- Ventana flotante principal (Ahora en X: 900, Y: 420 para vestir la zona derecha vacía) -->
    <g transform="rotate(4 1050 510)">
        <rect x="900" y="420" width="300" height="180" rx="14" fill="#7FE6C0" fill-opacity="0.02" stroke="#7FE6C0" stroke-opacity="0.15" stroke-width="1.5" />
        <!-- Detalles internos de la ventana flotante -->
        <circle cx="930" cy="450" r="6" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="950" cy="450" r="6" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="970" cy="450" r="6" fill="#7FE6C0" fill-opacity="0.15" />
        <rect x="924" y="480" width="180" height="15" rx="4" fill="#7FE6C0" fill-opacity="0.1" stroke="#7FE6C0" stroke-opacity="0.2" stroke-width="1" />
        <line x1="924" y1="510" x2="1100" y2="510" stroke="#7FE6C0" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="5 3" />
        <line x1="924" y1="530" x2="1060" y2="530" stroke="#7FE6C0" stroke-opacity="0.1" stroke-width="2" />
        <line x1="924" y1="550" x2="1140" y2="550" stroke="#7FE6C0" stroke-opacity="0.1" stroke-width="2" />
    </g>

    <!-- Elemento flotante secundario pequeño (Se mantiene arriba a la izquierda para sutil contraste) -->
    <rect x="80" y="150" width="200" height="120" rx="10" fill="#7FE6C0" fill-opacity="0.01" stroke="#7FE6C0" stroke-opacity="0.1" stroke-width="1" transform="rotate(-10 180 210)" />

    <!-- Elemento flotante estructural en líneas discontinuas (Arriba-Derecha) -->
    <rect x="1150" y="100" width="220" height="140" rx="12" fill="none" stroke="#7FE6C0" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="10 5" transform="rotate(15 1260 170)" />


    <!-- 6. CÍRCULOS ORBITALES CONCÉNTRICOS (Dashed) -->
    <circle cx="720" cy="450" r="280" fill="none" stroke="#7FE6C0" stroke-opacity="0.05" stroke-width="1.5" stroke-dasharray="12 8" />
    <circle cx="720" cy="450" r="200" fill="none" stroke="#7FE6C0" stroke-opacity="0.03" stroke-width="1" stroke-dasharray="8 6" />


    <!-- 7. ACENTOS GEOMÉTRICOS (Signos Plus) -->
    <g transform="translate(100, 480)" stroke="#7FE6C0" stroke-opacity="0.15" stroke-width="2">
        <line x1="0" y1="-9" x2="0" y2="9" />
        <line x1="-9" y1="0" x2="9" y2="0" />
    </g>

    <g transform="translate(1280, 750)" stroke="#7FE6C0" stroke-opacity="0.12" stroke-width="2">
        <line x1="0" y1="-8" x2="0" y2="8" />
        <line x1="-8" y1="0" x2="8" y2="0" />
    </g>
</svg>
