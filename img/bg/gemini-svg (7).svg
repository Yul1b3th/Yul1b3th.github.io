<svg width="100%" height="100%" viewBox="0 0 1440 900" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Landing Page Light Section - Overlapping Dashed Orbits &amp; Elevated Waves</title>
    
    <defs>
        <!-- Degradado base para las ondas en azul grisáceo #B6CDDC -->
        <linearGradient id="blueSolidGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#B6CDDC; stop-opacity:0.75" />
            <stop offset="100%" style="stop-color:#9ABCCF; stop-opacity:0.55" />
        </linearGradient>

        <!-- Degradado secundario para la onda cruzada -->
        <linearGradient id="slateBlueGradient" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#A3BFD0; stop-opacity:0.65" />
            <stop offset="100%" style="stop-color:#CBD5E1; stop-opacity:0.4" />
        </linearGradient>

        <!-- Resplandor circular de fondo muy sutil -->
        <radialGradient id="lightRadial" cx="70%" cy="20%" r="50%">
            <stop offset="0%" style="stop-color:#B6CDDC; stop-opacity:0.12" />
            <stop offset="100%" style="stop-color:#FFFFFF; stop-opacity:0" />
        </radialGradient>
    </defs>

    <!-- 1. Fondo transparente -->
    <rect width="1440" height="900" fill="#F8FAFC" fill-opacity="1" />

    <!-- 2. Resplandor de fondo -->
    <circle cx="950" cy="180" r="450" fill="url(#lightRadial)" />


    <!-- 3. SISTEMA DE CÍRCULOS DASHED ASIMÉTRICOS (Solapados entre sí, centro vacío) -->
    <!-- Círculo Principal Base (Grande, ~60% de escala visual) -->
    <circle cx="880" cy="110" r="260" fill="none" stroke="#B6CDDC" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="8 6" />
    
    <!-- Segundo Círculo (Mediano, desplazado hacia abajo a la izquierda para forzar el cruce) -->
    <circle cx="840" cy="150" r="180" fill="none" stroke="#B6CDDC" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="5 5" />
    
    <!-- Tercer Círculo (Pequeño, desplazado hacia arriba a la derecha, rompiendo la equidistancia) -->
    <circle cx="910" cy="90" r="110" fill="none" stroke="#7FE6C0" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 4" />


    <!-- 4. ONDAS SUAVES ELEVADAS -->
    <!-- Onda Inferior Izquierda -->
    <path d="M0,680 C250,690 400,620 600,740 C750,830 850,900 1000,900 L0,900 Z" fill="url(#blueSolidGradient)" />

    <!-- Juego de 2 Ondas en la Derecha (Suaves y elevadas) -->
    <!-- Onda Derecha Base -->
    <path d="M1440,380 C1340,430 1260,490 1200,610 C1140,730 1200,820 1440,900 Z" fill="url(#blueSolidGradient)" />
    <!-- Segunda Onda Derecha Cruzada -->
    <path d="M1440,470 C1320,510 1230,580 1150,700 C1100,780 1180,860 1440,900 Z" fill="url(#slateBlueGradient)" />

    <!-- Onda Superior Izquierda -->
    <path d="M0,0 L500,0 C350,70 180,95 0,55 Z" fill="url(#blueSolidGradient)" />


    <!-- 5. PATRÓN DE PUNTOS EN EL MEDIO A LA IZQUIERDA -->
    <g id="middleLeftGrid" transform="translate(120, 360)" fill="#B6CDDC" fill-opacity="0.25">
        <circle cx="0" cy="0" r="2" /><circle cx="30" cy="0" r="2" /><circle cx="60" cy="0" r="2" /><circle cx="90" cy="0" r="2" />
        <circle cx="0" cy="30" r="2" /><circle cx="30" cy="30" r="2" /><circle cx="60" cy="30" r="2" /><circle cx="90" cy="30" r="2" />
        <circle cx="0" cy="60" r="2" /><circle cx="30" cy="60" r="2" /><circle cx="60" cy="60" r="2" /><circle cx="90" cy="60" r="2" />
        <circle cx="0" cy="90" r="2" /><circle cx="30" cy="90" r="2" /><circle cx="60" cy="90" r="2" /><circle cx="90" cy="90" r="2" />
    </g>


    <!-- 6. GRUPOS DE PUNTOS MATRIX (Sobre las curvas) -->
    <!-- Cluster Superior Izquierdo -->
    <g id="clusterTopLeft" fill="#7FE6C0" fill-opacity="0.7" transform="translate(80, 20)">
        <circle cx="0" cy="0" r="1.5" /><circle cx="15" cy="5" r="2" /><circle cx="30" cy="2" r="1.5" />
        <circle cx="8" cy="18" r="1.5" /><circle cx="25" cy="15" r="2" />
    </g>

    <!-- Cluster Inferior Izquierdo -->
    <g id="clusterBottomLeftA" fill="#7FE6C0" fill-opacity="0.6" transform="translate(150, 720)">
        <circle cx="0" cy="0" r="2" /><circle cx="20" cy="8" r="2.5" /><circle cx="40" cy="3" r="1.8" />
        <circle cx="10" cy="20" r="1.5" /><circle cx="32" cy="18" r="2.2" />
    </g>

    <!-- Cluster Inferior Izquierdo - Central -->
    <g id="clusterBottomLeftB" transform="translate(420, 730)">
        <circle cx="0" cy="5" r="2" fill="#B6CDDC" fill-opacity="0.8" />
        <circle cx="18" cy="0" r="1.5" fill="#7FE6C0" fill-opacity="0.6" />
        <circle cx="35" cy="12" r="2.5" fill="#B6CDDC" fill-opacity="0.8" />
    </g>

    <!-- Clusters sobre las Ondas de la Derecha -->
    <g id="clusterRightA" fill="#7FE6C0" fill-opacity="0.6" transform="translate(1230, 580)">
        <circle cx="0" cy="15" r="2" /><circle cx="20" cy="0" r="2.2" /><circle cx="45" cy="8" r="1.5" />
    </g>
    <g id="clusterRightB" fill="#B6CDDC" fill-opacity="0.7" transform="translate(1320, 680)">
        <circle cx="0" cy="0" r="2" /><circle cx="25" cy="5" r="1.8" /><circle cx="12" cy="20" r="2.2" />
    </g>


    <!-- 7. ACENTOS GEOMÉTRICOS PERIFÉRICOS EXTRAS -->
    <circle cx="1350" cy="200" r="60" fill="none" stroke="#B6CDDC" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="1350" cy="200" r="35" fill="none" stroke="#B6CDDC" stroke-opacity="0.2" stroke-width="1.2" />
    <circle cx="150" cy="820" r="40" fill="none" stroke="#1C1C1C" stroke-opacity="0.04" stroke-width="1.2" stroke-dasharray="4 4" />
    
    <!-- Signos Plus -->
    <g transform="translate(1350, 320)" stroke="#B6CDDC" stroke-opacity="0.5" stroke-width="1.5">
        <line x1="0" y1="-6" x2="0" y2="6" />
        <line x1="-6" y1="0" x2="6" y2="0" />
    </g>
    <g transform="translate(700, 840)" stroke="#7FE6C0" stroke-opacity="0.4" stroke-width="1.5">
        <line x1="0" y1="-6" x2="0" y2="6" />
        <line x1="-6" y1="0" x2="6" y2="0" />
    </g>
</svg>
