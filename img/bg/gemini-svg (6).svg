<svg width="100%" height="100%" viewBox="0 0 1440 900" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Landing Page Light Section - Solid Waves &amp; Matrix Dots</title>
    
    <defs>
        <linearGradient id="lightLinearGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#7FE6C0; stop-opacity:0.4" />
            <stop offset="60%" style="stop-color:#B6CDDC; stop-opacity:0.6" />
            <stop offset="100%" style="stop-color:#E2E8F0; stop-opacity:0.7" />
        </linearGradient>

        <linearGradient id="mintSolidGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7FE6C0; stop-opacity:0.65" />
            <stop offset="100%" style="stop-color:#50CDA3; stop-opacity:0.3" />
        </linearGradient>

        <linearGradient id="waveGradientSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#B6CDDC; stop-opacity:0.5" />
            <stop offset="100%" style="stop-color:#7FE6C0; stop-opacity:0.3" />
        </linearGradient>

        <radialGradient id="lightRadial" cx="85%" cy="20%" r="60%">
            <stop offset="0%" style="stop-color:#7FE6C0; stop-opacity:0.25" />
            <stop offset="100%" style="stop-color:#FFFFFF; stop-opacity:0" />
        </radialGradient>
    </defs>

    <rect width="1440" height="900" fill="#F8FAFC" fill-opacity="1" />

    <circle cx="1200" cy="150" r="450" fill="url(#lightRadial)" />

    <path d="M0,500 C250,550 350,450 550,600 C720,720 780,900 950,900 L0,900 Z" fill="url(#lightLinearGradient)" opacity="0.8" />
    
    <path d="M0,600 C180,630 280,520 450,680 C580,780 650,900 820,900 L0,900 Z" fill="url(#mintSolidGradient)" opacity="0.85" />

    <path d="M0,700 C120,720 220,630 350,760 C440,840 500,900 650,900 L0,900 Z" fill="url(#waveGradientSecondary)" opacity="0.9" />

    <path d="M1440,250 C1320,380 1150,450 1100,620 C1050,780 1200,830 1440,900 Z" fill="url(#mintSolidGradient)" opacity="0.75" />
    
    <path d="M1440,400 C1380,500 1250,550 1220,680 C1180,800 1280,860 1440,900 Z" fill="url(#lightLinearGradient)" opacity="0.85" />

    <path d="M0,0 L500,0 C380,180 180,240 0,130 Z" fill="url(#mintSolidGradient)" opacity="0.8" />
    
    <path d="M0,0 L380,0 C280,140 140,200 0,95 L0,0 Z" fill="url(#waveGradientSecondary)" opacity="0.85" />


    <g id="matrixCurvedDots">
        <g fill="#1C1C1C" fill-opacity="0.08">
            <circle cx="100" cy="180" r="1.5" /><circle cx="140" cy="185" r="1.5" /><circle cx="180" cy="195" r="1.5" /><circle cx="220" cy="210" r="1.5" /><circle cx="260" cy="230" r="1.5" /><circle cx="300" cy="255" r="1.5" /><circle cx="340" cy="285" r="1.5" /><circle cx="380" cy="320" r="1.5" />
            <circle cx="100" cy="205" r="1.5" /><circle cx="140" cy="210" r="1.5" /><circle cx="180" cy="220" r="1.5" /><circle cx="220" cy="235" r="1.5" /><circle cx="260" cy="255" r="1.5" /><circle cx="300" r="1.5" cy="280" /><circle cx="340" cy="310" r="1.5" /><circle cx="380" cy="345" r="1.5" />
            <circle cx="100" cy="230" r="1.5" /><circle cx="140" cy="235" r="1.5" /><circle cx="180" cy="245" r="1.5" /><circle cx="220" cy="260" r="1.5" /><circle cx="260" cy="280" r="1.5" /><circle cx="300" cy="305" r="1.5" /><circle cx="340" cy="335" r="1.5" /><circle cx="380" cy="370" r="1.5" />
        </g>
        
        <g fill="#B6CDDC" fill-opacity="0.8" transform="translate(750, 200)">
            <circle cx="200" cy="150" r="2" /><circle cx="235" cy="130" r="2" /><circle cx="270" cy="115" r="2" /><circle cx="305" cy="105" r="2" /><circle cx="340" cy="100" r="2" /><circle cx="375" cy="100" r="2" /><circle cx="410" cy="105" r="2" />
            <circle cx="200" cy="175" r="2" /><circle cx="235" cy="155" r="2" /><circle cx="270" cy="140" r="2" /><circle cx="305" cy="130" r="2" /><circle cx="340" cy="125" r="2" /><circle cx="375" cy="125" r="2" /><circle cx="410" cy="130" r="2" />
            <circle cx="200" cy="200" r="2" /><circle cx="235" cy="180" r="2" /><circle cx="270" cy="165" r="2" /><circle cx="305" cy="155" r="2" /><circle cx="340" cy="150" r="2" /><circle cx="375" cy="150" r="2" /><circle cx="410" cy="155" r="2" />
        </g>
    </g>

    <g id="lightDotGrid" transform="translate(80, 450)">
        <circle cx="0" cy="0" r="1.5" fill="#1C1C1C" fill-opacity="0.05" /><circle cx="25" cy="0" r="1.5" fill="#1C1C1C" fill-opacity="0.05" /><circle cx="50" cy="0" r="1.5" fill="#1C1C1C" fill-opacity="0.05" />
        <circle cx="0" cy="25" r="1.5" fill="#1C1C1C" fill-opacity="0.05" /><circle cx="25" cy="25" r="1.5" fill="#1C1C1C" fill-opacity="0.05" /><circle cx="50" cy="25" r="1.5" fill="#1C1C1C" fill-opacity="0.05" />
    </g>

    <line x1="0" y1="150" x2="1440" y2="150" stroke="#1C1C1C" stroke-opacity="0.03" stroke-width="1" />
    <line x1="1100" y1="0" x2="1100" y2="900" stroke="#1C1C1C" stroke-opacity="0.02" stroke-width="1" />
    <line x1="350" y1="0" x2="350" y2="900" stroke="#1C1C1C" stroke-opacity="0.015" stroke-width="1" />

    <circle cx="1300" cy="250" r="70" fill="none" stroke="#B6CDDC" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="1300" cy="250" r="40" fill="none" stroke="#B6CDDC" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="600" cy="300" r="25" fill="none" stroke="#1C1C1C" stroke-opacity="0.05" stroke-width="1.2" stroke-dasharray="4 4" />
    
    <g transform="translate(950, 180)" stroke="#B6CDDC" stroke-opacity="0.7" stroke-width="1.5">
        <line x1="0" y1="-6" x2="0" y2="6" />
        <line x1="-6" y1="0" x2="6" y2="0" />
    </g>
    <g transform="translate(520, 720)" stroke="#7FE6C0" stroke-opacity="0.5" stroke-width="2">
        <line x1="0" y1="-8" x2="0" y2="8" />
        <line x1="-8" y1="0" x2="8" y2="0" />
    </g>
</svg>
