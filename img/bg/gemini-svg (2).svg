<svg width="100%" height="100%" viewBox="0 0 1440 900" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Landing Page - Fondo Sección Clara</title>
    
    <defs>
        <!-- Degradado suave y sutil para las formas orgánicas fluidas -->
        <linearGradient id="softClearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7FE6C0; stop-opacity:0.08" />
            <stop offset="40%" style="stop-color:#A8F1D7; stop-opacity:0.03" />
            <stop offset="100%" style="stop-color:#FFFFFF; stop-opacity:0" />
        </linearGradient>

        <!-- Degradado grisáceo ultra sutil para dar volumen sin añadir color -->
        <linearGradient id="grayVolume" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#E2E8F0; stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#FFFFFF; stop-opacity:0" />
        </linearGradient>
    </defs>

    <!-- 1. Fondo base de la sección (Usando tu gris claro de SASS) -->
    <rect width="1440" height="900" fill="#FAFAFA" />

    <!-- 2. Formas Orgánicas Fluídas (Estilo ondas suaves y abstractas de la landing de referencia) -->
    <!-- Gran onda fluida superior izquierda -->
    <path d="M0,0 C300,100 500,-50 700,120 C850,250 600,450 400,500 C200,550 0,400 0,0 Z" fill="url(#softClearGradient)" />
    
    <!-- Onda fluida entrelazada para dar el efecto de capas/capas transparentes -->
    <path d="M0,80 C250,180 450,20 600,200 C700,320 550,500 300,480 C150,460 0,600 0,80 Z" fill="url(#grayVolume)" />

    <!-- Onda fluida inferior derecha para equilibrar la composición -->
    <path d="M1440,900 C1100,900 950,750 900,600 C850,450 1100,350 1440,400 Z" fill="url(#softClearGradient)" />
    <path d="M1440,820 C1200,850 1050,700 1000,550 C980,500 1200,400 1440,480 Z" fill="url(#grayVolume)" />

    <!-- 3. Desenfoques sutiles (Glows) que aportan profundidad visual sin cargar -->
    <circle cx="1200" cy="200" r="250" fill="#7FE6C0" opacity="0.04" filter="blur(50px)" />
    <circle cx="200" cy="700" r="200" fill="#7FE6C0" opacity="0.03" filter="blur(40px)" />

    <!-- 4. Geometría tecnológica abstracta (Anillos finos) -->
    <circle cx="1150" cy="250" r="90" fill="none" stroke="#7FE6C0" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="1150" cy="250" r="130" fill="none" stroke="#7FE6C0" stroke-opacity="0.05" stroke-width="1.5" />
    
    <circle cx="250" cy="200" r="70" fill="none" stroke="#1C1C1C" stroke-opacity="0.03" stroke-width="1" />

    <!-- 5. Pequeños detalles de código/interfaz abstracta flotando muy sutilmente -->
    <!-- Una pequeña tarjeta translúcida de fondo -->
    <rect x="150" y="300" width="220" height="120" rx="16" fill="#FFFFFF" fill-opacity="0.4" stroke="#E2E8F0" stroke-opacity="0.5" stroke-width="1" />
    <line x1="180" y1="330" x2="260" y2="330" stroke="#7FE6C0" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="350" x2="310" y2="350" stroke="#1C1C1C" stroke-opacity="0.06" stroke-width="2" stroke-linecap="round" />
    <line x1="180" y1="370" x2="280" y2="370" stroke="#1C1C1C" stroke-opacity="0.06" stroke-width="2" stroke-linecap="round" />

</svg>
