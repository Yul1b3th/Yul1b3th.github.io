<svg width="100%" height="100%" viewBox="0 0 1440 900" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Landing Page Hero Background</title>
    
    <defs>
        <!-- Degradado suave para las formas orgánicas -->
        <linearGradient id="gradientShape" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7FE6C0; stop-opacity:0.15" />
            <stop offset="100%" style="stop-color:#30DAA6; stop-opacity:0.02" />
        </linearGradient>
    </defs>

    <!-- 1. Fondo de la sección -->
    <rect width="1440" height="900" fill="#0B132B" />

    <!-- 2. Patrón de puntos (Esquina superior izquierda) -->
    <g id="dotPatternLeft" transform="translate(60, 80)">
        <circle cx="0" cy="0" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="20" cy="0" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="40" cy="0" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="60" cy="0" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="0" cy="20" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="20" cy="20" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="40" cy="20" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="60" cy="20" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="0" cy="40" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="20" cy="40" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="40" cy="40" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="60" cy="40" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="0" cy="60" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="20" cy="60" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="40" cy="60" r="2" fill="#7FE6C0" fill-opacity="0.15" />
        <circle cx="60" cy="60" r="2" fill="#7FE6C0" fill-opacity="0.15" />
    </g>

    <!-- 3. Patrón de puntos (Esquina inferior derecha) -->
    <g id="dotPatternRight" transform="translate(1250, 600)">
        <circle cx="0" cy="0" r="2" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="20" cy="0" r="2" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="40" cy="0" r="2" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="60" cy="0" r="2" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="0" cy="20" r="2" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="20" cy="20" r="2" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="40" cy="20" r="2" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="60" cy="20" r="2" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="0" cy="40" r="2" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="20" cy="40" r="2" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="40" cy="40" r="2" fill="#7FE6C0" fill-opacity="0.12" />
        <circle cx="60" cy="40" r="2" fill="#7FE6C0" fill-opacity="0.12" />
    </g>

    <!-- 4. Formas abstractas y geométricas añadidas -->
    
    <!-- Círculo difuminado gigante de fondo (Glow izquierdo) -->
    <circle cx="200" cy="450" r="300" fill="#7FE6C0" opacity="0.03" filter="blur(40px)" />
    
    <!-- Gran curva orgánica en la zona derecha (estilo fondo de landing) -->
    <path d="M900,900 C1100,850 1300,600 1440,350 L1440,900 Z" fill="url(#gradientShape)" />

    <!-- Líneas de cuadrícula/Grid sutiles (simula entorno de desarrollo) -->
    <path d="M0,300 L1440,300 M0,600 L1440,600 M480,0 L480,900 M960,0 L960,900" stroke="#7FE6C0" stroke-opacity="0.04" stroke-width="1" />

    <!-- Elementos flotantes geométricos (Rectángulos y círculos con bordes limpios) -->
    <!-- Elemento flotante 1 (Centro-Derecha) -->
    <rect x="1000" y="180" width="280" height="160" rx="12" fill="#7FE6C0" fill-opacity="0.02" stroke="#7FE6C0" stroke-opacity="0.15" stroke-width="1.5" transform="rotate(-5 1140 260)" />
    <circle cx="1030" cy="210" r="6" fill="#7FE6C0" fill-opacity="0.3" />
    <circle cx="1050" cy="210" r="6" fill="#7FE6C0" fill-opacity="0.15" />
    <circle cx="1070" cy="210" r="6" fill="#7FE6C0" fill-opacity="0.15" />
    <line x1="1024" y1="240" x2="1140" y2="240" stroke="#7FE6C0" stroke-opacity="0.2" stroke-width="2" />
    <line x1="1024" y1="260" x2="1220" y2="260" stroke="#7FE6C0" stroke-opacity="0.1" stroke-width="2" />
    <line x1="1024" y1="280" x2="1180" y2="280" stroke="#7FE6C0" stroke-opacity="0.1" stroke-width="2" />

    <!-- Elemento flotante 2 (Abajo-Izquierda) -->
    <rect x="150" y="650" width="180" height="100" rx="8" fill="#7FE6C0" fill-opacity="0.01" stroke="#7FE6C0" stroke-opacity="0.1" stroke-width="1" transform="rotate(8 240 700)" />
    
    <!-- Círculos concéntricos decorativos (Estilo ondas tecnológicas) -->
    <circle cx="1350" cy="120" r="80" fill="none" stroke="#7FE6C0" stroke-opacity="0.08" stroke-width="1" />
    <circle cx="1350" cy="120" r="50" fill="none" stroke="#7FE6C0" stroke-opacity="0.05" stroke-width="1" />
    <circle cx="1350" cy="120" r="20" fill="none" stroke="#7FE6C0" stroke-opacity="0.03" stroke-width="1" />

    <!-- Cruz decorativa (Plus sign) -->
    <g transform="translate(450, 180)" stroke="#7FE6C0" stroke-opacity="0.2" stroke-width="2">
        <line x1="0" y1="-10" x2="0" y2="10" />
        <line x1="-10" y1="0" x2="10" y2="0" />
    </g>
    
    <g transform="translate(850, 720)" stroke="#7FE6C0" stroke-opacity="0.15" stroke-width="2">
        <line x1="0" y1="-8" x2="0" y2="8" />
        <line x1="-8" y1="0" x2="8" y2="0" />
    </g>
</svg>
